[project]
name = "shoulder"
version = "0.1.0"
description = "Private agents that negotiate the family caregiving load"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }

dependencies = [
    "strands-agents[a2a]>=1.55.0",
    "strands-agents-tools>=0.8.8",
    "boto3>=1.43.0",
    "pydantic>=2.13.0",
    "fastapi>=0.141.0",
    "uvicorn>=0.52.0",
    "python-dotenv>=1.2.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.0"]

[project.scripts]
shoulder = "shoulder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shoulder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Legacy A2A streaming. The reply is held (shoulder.a2a.serve), so moot.
    "ignore:The default A2A response stream:UserWarning",
]
