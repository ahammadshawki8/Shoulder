<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Private agents that negotiate the family caregiving load." />
    <title>Shoulder</title>
    <script>
      // Apply the saved theme before first paint, so dark mode never flashes light.
      // ?theme=dark or ?theme=light forces one, which helps when recording.
      try {
        const forced = new URLSearchParams(location.search).get("theme");
        const saved = forced || localStorage.getItem("shoulder-theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
